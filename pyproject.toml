[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "penlocal-lite"
dynamic = ["version"]
description = "A local-AI penetration-testing harness — the model is only the brain."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "rich>=13.7",
]

[project.scripts]
penlocal = "penlocal.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["penlocal", "penlocal.web"]

[tool.setuptools.dynamic]
# Single source of truth: the release workflow bumps __version__ only.
version = { attr = "penlocal.__version__" }

[tool.setuptools.package-data]
"penlocal.web" = ["static/*"]
